<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Aryan Vishwakarma — AI Systems Engineer, Data Scientist, ML Practitioner, Data Analyst">
  <defs>
    <!-- Deep Space Midnight Gradient -->
    <linearGradient id="deepVoid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#07080E"/>
      <stop offset="50%"  stop-color="#0B0D18"/>
      <stop offset="100%" stop-color="#101322"/>
    </linearGradient>

    <!-- Electric Violet to Cyan Gradient -->
    <linearGradient id="neonGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="50%"  stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="nebulaGlowLeft" cx="0.15" cy="0.4" r="0.5">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaGlowRight" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Technical Cross Dot Pattern -->
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#8B5CF6" fill-opacity="0.12"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="violetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="bannerClip">
      <rect width="1000" height="310" rx="14"/>
    </clipPath>

    <!-- Circuit Paths connecting Project Modules -->
    <path id="coreToSolva" d="M 815 148 L 732 148 L 732 115"/>
    <path id="coreToVayu" d="M 815 148 L 902 148 L 902 115"/>
    <path id="coreToResilix" d="M 815 148 L 732 148 L 732 182"/>
    <path id="coreToForge" d="M 815 148 L 902 148 L 902 182"/>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Canvas Base -->
    <rect width="1000" height="310" fill="url(#deepVoid)"/>
    <rect width="1000" height="310" fill="url(#dotPattern)"/>
    <rect width="1000" height="310" fill="url(#nebulaGlowLeft)"/>
    <rect width="1000" height="310" fill="url(#nebulaGlowRight)"/>

    <!-- Top HUD Navigation Bar -->
    <rect x="36" y="20" width="928" height="28" rx="6" fill="#0E1220" stroke="#1E2640" stroke-width="1"/>
    
    <!-- Status Indicator -->
    <circle cx="56" cy="34" r="4" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="10" font-weight="700" letter-spacing="2.5" fill="#00F0FF">SYS: ONLINE</text>

    <line x1="166" y1="24" x2="166" y2="44" stroke="#1E2640" stroke-width="1"/>

    <text x="182" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#94A3B8">AI ENGINEER // DATA SCIENTIST // ANALYST</text>

    <line x1="535" y1="24" x2="535" y2="44" stroke="#1E2640" stroke-width="1"/>

    <text x="550" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#8B5CF6">DSA: aizen_xp</text>

    <line x1="680" y1="24" x2="680" y2="44" stroke="#1E2640" stroke-width="1"/>

    <text x="696" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#64748B">LOC: INDIA // CORE: FAULT-TOLERANT</text>

    <!-- Main Identity (Left Side) -->
    <g transform="translate(48, 76)">
      <!-- Prefix Terminal Tag -->
      <text x="0" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="12" letter-spacing="3" font-weight="600" fill="#6366F1">// ARCHITECTING INTELLIGENT SYSTEMS</text>
      
      <!-- Primary Name Title -->
      <text x="0" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="40" font-weight="900" letter-spacing="1.5" fill="#F8FAFC" filter="url(#violetGlow)">ARYAN VISHWAKARMA</text>

      <!-- Four Core Roles -->
      <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">
        <text x="0" y="100" fill="#00F0FF">AI SYSTEMS ENGINEER</text>
        <text x="162" y="100" fill="#475569">&#9670;</text>
        <text x="178" y="100" fill="#8B5CF6">DATA SCIENTIST</text>
        <text x="290" y="100" fill="#475569">&#9670;</text>
        <text x="306" y="100" fill="#38BDF8">ML PRACTITIONER</text>
        <text x="432" y="100" fill="#475569">&#9670;</text>
        <text x="448" y="100" fill="#A855F7">DATA ANALYST</text>
      </g>

      <!-- Philosophy Line -->
      <text x="0" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" fill="#94A3B8">
        Turning statistical variance into reliable, production-grade intelligence.
      </text>

      <!-- Capability Badges -->
      <g transform="translate(0, 148)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">
        <rect x="0" y="0" width="138" height="24" rx="12" fill="#121626" stroke="#6366F1" stroke-opacity="0.5"/>
        <text x="69" y="16" text-anchor="middle" fill="#E2E8F0">Statistical Indexing</text>

        <rect x="146" y="0" width="134" height="24" rx="12" fill="#121626" stroke="#00F0FF" stroke-opacity="0.5"/>
        <text x="213" y="16" text-anchor="middle" fill="#E2E8F0">Anomaly Detection</text>

        <rect x="288" y="0" width="130" height="24" rx="12" fill="#121626" stroke="#8B5CF6" stroke-opacity="0.5"/>
        <text x="353" y="16" text-anchor="middle" fill="#E2E8F0">Resilience Chaos</text>

        <rect x="426" y="0" width="128" height="24" rx="12" fill="#121626" stroke="#38BDF8" stroke-opacity="0.5"/>
        <text x="490" y="16" text-anchor="middle" fill="#E2E8F0">Storage Engines</text>
      </g>
    </g>

    <!-- Right Side: Animated Data Flux Equalizer + Project Telemetry Core -->
    <!-- 1. Equalizer Moving Bars (Kept as requested!) -->
    <g transform="translate(596, 120)">
      <rect x="0"  y="0" width="4" height="24" rx="2" fill="#6366F1">
        <animate attributeName="height" values="10;42;16;32;10" dur="1.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="8"  y="0" width="4" height="32" rx="2" fill="#8B5CF6">
        <animate attributeName="height" values="24;52;14;44;24" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="0" width="4" height="18" rx="2" fill="#00F0FF">
        <animate attributeName="height" values="16;32;48;12;16" dur="2.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="0" width="4" height="40" rx="2" fill="#38BDF8">
        <animate attributeName="height" values="34;14;50;28;34" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="32" y="0" width="4" height="22" rx="2" fill="#A855F7">
        <animate attributeName="height" values="14;38;22;46;14" dur="1.8s" repeatCount="indefinite"/>
      </rect>

      <text x="18" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8.5" letter-spacing="1.5" fill="#64748B" text-anchor="middle">DATA FLUX</text>
    </g>

    <!-- 2. Project Modules & Interconnected Core (Showing user's actual projects!) -->
    <!-- Connecting circuit lines -->
    <g stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.4" fill="none">
      <use href="#coreToSolva"/>
      <use href="#coreToVayu"/>
      <use href="#coreToResilix"/>
      <use href="#coreToForge"/>
    </g>

    <!-- Animated Data Packets traveling to projects -->
    <circle r="3.5" fill="#00F0FF">
      <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#coreToSolva"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#38BDF8">
      <animateMotion dur="2.5s" begin="0.4s" repeatCount="indefinite"><mpath href="#coreToVayu"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#8B5CF6">
      <animateMotion dur="3.0s" begin="0.8s" repeatCount="indefinite"><mpath href="#coreToResilix"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.0s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#EC4899">
      <animateMotion dur="2.7s" begin="1.2s" repeatCount="indefinite"><mpath href="#coreToForge"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.7s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Central Telemetry Core -->
    <circle cx="815" cy="148" r="14" fill="#0C101E" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="815" cy="148" r="6" fill="#00F0FF">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Project 1: SOLVA (Top-Left) -->
    <g transform="translate(660, 80)">
      <rect x="0" y="0" width="144" height="42" rx="7" fill="#0A1120" stroke="#00F0FF" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="3.5" fill="#00F0FF"/>
      <text x="24" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10.5" font-weight="700" fill="#00F0FF">SOLVA</text>
      <text x="14" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#94A3B8">Ollama · Anomaly AI</text>
    </g>

    <!-- Project 2: VAYUSUTRA (Top-Right) -->
    <g transform="translate(820, 80)">
      <rect x="0" y="0" width="144" height="42" rx="7" fill="#0A1120" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="3.5" fill="#38BDF8"/>
      <text x="24" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10.5" font-weight="700" fill="#38BDF8">VAYUSUTRA</text>
      <text x="14" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#94A3B8">CPI Index · Analytics</text>
    </g>

    <!-- Project 3: RESILIX (Bottom-Left) -->
    <g transform="translate(660, 175)">
      <rect x="0" y="0" width="144" height="42" rx="7" fill="#120D20" stroke="#8B5CF6" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="3.5" fill="#8B5CF6"/>
      <text x="24" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10.5" font-weight="700" fill="#A855F7">RESILIX</text>
      <text x="14" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#94A3B8">Chaos · Concurrency</text>
    </g>

    <!-- Project 4: FORGE (Bottom-Right) -->
    <g transform="translate(820, 175)">
      <rect x="0" y="0" width="144" height="42" rx="7" fill="#120D20" stroke="#EC4899" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="3.5" fill="#EC4899"/>
      <text x="24" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10.5" font-weight="700" fill="#EC4899">FORGE</text>
      <text x="14" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#94A3B8">WAL Storage · Crash-Safe</text>
    </g>

    <!-- Section Label Below Projects -->
    <text x="815" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="8.5" letter-spacing="2" fill="#64748B" text-anchor="middle">INTELLIGENCE &amp; SYSTEMS CORE</text>

    <!-- Outer Sleek Border -->
    <rect x="1" y="1" width="998" height="308" rx="14" fill="none" stroke="url(#neonGradient)" stroke-opacity="0.3" stroke-width="1.2"/>
  </g>
</svg>
