<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Aryan Vishwakarma — AI Systems Engineer, Data Scientist, ML Practitioner, Data Analyst">
  <defs>
    <!-- Deep Space Background -->
    <linearGradient id="spaceDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#05070B"/>
      <stop offset="50%"  stop-color="#080B14"/>
      <stop offset="100%" stop-color="#0D111E"/>
    </linearGradient>

    <!-- Isometric Face Gradients (Cyan Theme) -->
    <linearGradient id="isoTopCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="isoLeftCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="isoRightCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0284C7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Isometric Face Gradients (Blue Theme) -->
    <linearGradient id="isoTopBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="isoLeftBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="isoRightBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0284C7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Isometric Face Gradients (Violet Theme) -->
    <linearGradient id="isoTopViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="isoLeftViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="isoRightViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Isometric Face Gradients (Pink Theme) -->
    <linearGradient id="isoTopPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F472B6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="isoLeftPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="isoRightPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#BE185D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="bannerFrame">
      <rect width="1000" height="290" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerFrame)">
    <rect width="1000" height="290" fill="url(#spaceDark)"/>

    <!-- ═══ LEFT IDENTITY SECTION (Shifted Left & Spacious) ═══ -->
    <g transform="translate(38, 30)">
      <!-- Minimalist Status Line -->
      <g transform="translate(0, 0)">
        <circle cx="4" cy="4" r="3.5" fill="#00F0FF">
          <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="16" y="7.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="9.5" font-weight="700" letter-spacing="3" fill="#00F0FF">KERNEL // ONLINE</text>
        <text x="145" y="7.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="9.5" letter-spacing="2" fill="#475569">//</text>
        <text x="162" y="7.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="9.5" letter-spacing="2" fill="#94A3B8">AI SYSTEMS · DATA SCIENCE · QUANTITATIVE ANALYSIS</text>
      </g>

      <!-- Terminal Prefix -->
      <text x="0" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" letter-spacing="2.5" font-weight="600" fill="#6366F1">// ARCHITECTING INTELLIGENT SYSTEMS</text>

      <!-- Name Title -->
      <text x="0" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="34" font-weight="900" letter-spacing="1.5" fill="#F8FAFC" filter="url(#softGlow)">ARYAN VISHWAKARMA</text>

      <!-- Four Core Roles (Clean 2-line layout for maximum breathing space) -->
      <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700">
        <text x="0" y="106" fill="#00F0FF">AI SYSTEMS ENGINEER</text>
        <text x="148" y="106" fill="#475569">&#9670;</text>
        <text x="162" y="106" fill="#8B5CF6">DATA SCIENTIST</text>
        <text x="262" y="106" fill="#475569">&#9670;</text>
        <text x="276" y="106" fill="#38BDF8">ML PRACTITIONER</text>
        <text x="390" y="106" fill="#475569">&#9670;</text>
        <text x="404" y="106" fill="#A855F7">DATA ANALYST</text>
      </g>

      <!-- Philosophy Line -->
      <text x="0" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10" fill="#94A3B8">
        Turning complex statistical variance into deterministic, fault-tolerant intelligence.
      </text>

      <!-- Clean 2x2 Tag Grid (Eliminates horizontal stretching & leaves 250px+ gap!) -->
      <g transform="translate(0, 154)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9">
        <!-- Row 1 -->
        <rect x="0" y="0" width="132" height="20" rx="10" fill="#0D111E" stroke="#6366F1" stroke-opacity="0.4"/>
        <text x="66" y="13.5" text-anchor="middle" fill="#CBD5E1">Statistical Indexing</text>

        <rect x="140" y="0" width="126" height="20" rx="10" fill="#0D111E" stroke="#00F0FF" stroke-opacity="0.4"/>
        <text x="203" y="13.5" text-anchor="middle" fill="#CBD5E1">Anomaly Detection</text>

        <!-- Row 2 -->
        <rect x="0" y="26" width="132" height="20" rx="10" fill="#0D111E" stroke="#8B5CF6" stroke-opacity="0.4"/>
        <text x="66" y="39.5" text-anchor="middle" fill="#CBD5E1">Chaos Resilience</text>

        <rect x="140" y="26" width="126" height="20" rx="10" fill="#0D111E" stroke="#38BDF8" stroke-opacity="0.4"/>
        <text x="203" y="39.5" text-anchor="middle" fill="#CBD5E1">Storage Engines</text>
      </g>
    </g>

    <!-- ═══ RIGHT: 3D ISOMETRIC ARCHITECTURE (Positioned at x=670 for zero overlap!) ═══ -->
    <g transform="translate(670, 0)">
      <!-- Isometric Floor Grid -->
      <g stroke="#6366F1" stroke-opacity="0.10" stroke-width="1" fill="none">
        <line x1="10"  y1="60"  x2="210" y2="180"/>
        <line x1="50"  y1="40"  x2="250" y2="160"/>
        <line x1="90"  y1="20"  x2="290" y2="140"/>
        <line x1="130" y1="0"   x2="330" y2="120"/>

        <line x1="50"  y1="170" x2="250" y2="50"/>
        <line x1="90"  y1="190" x2="290" y2="70"/>
        <line x1="130" y1="210" x2="330" y2="90"/>
      </g>

      <!-- Projection Drop-shadows to Grid Floor -->
      <g stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3" fill="none">
        <line x1="135" y1="70"  x2="135" y2="130"/>
        <line x1="245" y1="110" x2="245" y2="170"/>
        <line x1="55"  y1="150" x2="55"  y2="210"/>
        <line x1="175" y1="195" x2="175" y2="255"/>
      </g>

      <!-- Interconnecting Circuit Paths -->
      <g stroke="#6366F1" stroke-width="1.6" stroke-opacity="0.5" fill="none">
        <path d="M 135 70 L 245 110"/>
        <path d="M 135 70 L 55 150"/>
        <path d="M 245 110 L 175 195"/>
        <path d="M 55 150 L 175 195"/>
      </g>

      <!-- Animated Glowing Data Packets -->
      <circle r="3" fill="#00F0FF">
        <animateMotion dur="3s" repeatCount="indefinite" path="M 135 70 L 245 110"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#8B5CF6">
        <animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M 135 70 L 55 150"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#38BDF8">
        <animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M 245 110 L 175 195"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#EC4899">
        <animateMotion dur="3.4s" begin="1.2s" repeatCount="indefinite" path="M 55 150 L 175 195"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>

      <!-- ═══ 3D ISOMETRIC CUBE 1: SOLVA (Cyan Theme) ═══ -->
      <g transform="translate(135, 70)">
        <ellipse cx="0" cy="0" rx="30" ry="18" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.6"/>
        <ellipse cx="0" cy="0" rx="36" ry="22" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3 4"/>

        <!-- Top Face -->
        <polygon points="0,-14 22,-2 0,10 -22,-2" fill="url(#isoTopCyan)" stroke="#00F0FF" stroke-width="1.4"/>
        <!-- Left Face -->
        <polygon points="-22,-2 0,10 0,36 -22,24" fill="url(#isoLeftCyan)" stroke="#00F0FF" stroke-width="1.4"/>
        <!-- Right Face -->
        <polygon points="0,10 22,-2 22,24 0,36" fill="url(#isoRightCyan)" stroke="#00F0FF" stroke-width="1.4"/>
        <!-- Icon -->
        <text x="0" y="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="11" fill="#00F0FF" text-anchor="middle" font-weight="bold">&#9029;</text>

        <!-- Technical Label Badge -->
        <rect x="-38" y="42" width="76" height="18" rx="4" fill="#070A14" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1"/>
        <text x="0" y="54.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="8.5" font-weight="700" fill="#00F0FF" text-anchor="middle">SOLVA AI</text>
      </g>

      <!-- ═══ 3D ISOMETRIC CUBE 2: VAYUSUTRA (Blue Theme) ═══ -->
      <g transform="translate(245, 110)">
        <!-- Top Face -->
        <polygon points="0,-14 22,-2 0,10 -22,-2" fill="url(#isoTopBlue)" stroke="#38BDF8" stroke-width="1.4"/>
        <!-- Left Face -->
        <polygon points="-22,-2 0,10 0,36 -22,24" fill="url(#isoLeftBlue)" stroke="#38BDF8" stroke-width="1.4"/>
        <!-- Right Face -->
        <polygon points="0,10 22,-2 22,24 0,36" fill="url(#isoRightBlue)" stroke="#38BDF8" stroke-width="1.4"/>
        <!-- Icon -->
        <text x="0" y="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="11" fill="#38BDF8" text-anchor="middle" font-weight="bold">&#8984;</text>

        <!-- Technical Label Badge -->
        <rect x="-44" y="42" width="88" height="18" rx="4" fill="#070A14" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="0" y="54.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="8.5" font-weight="700" fill="#38BDF8" text-anchor="middle">VAYUSUTRA</text>
      </g>

      <!-- ═══ 3D ISOMETRIC CUBE 3: RESILIX (Violet Theme) ═══ -->
      <g transform="translate(55, 150)">
        <!-- Top Face -->
        <polygon points="0,-14 22,-2 0,10 -22,-2" fill="url(#isoTopViolet)" stroke="#C084FC" stroke-width="1.4"/>
        <!-- Left Face -->
        <polygon points="-22,-2 0,10 0,36 -22,24" fill="url(#isoLeftViolet)" stroke="#8B5CF6" stroke-width="1.4"/>
        <!-- Right Face -->
        <polygon points="0,10 22,-2 22,24 0,36" fill="url(#isoRightViolet)" stroke="#7C3AED" stroke-width="1.4"/>
        <!-- Icon -->
        <text x="0" y="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="11" fill="#C084FC" text-anchor="middle" font-weight="bold">&#9671;</text>

        <!-- Technical Label Badge -->
        <rect x="-38" y="42" width="76" height="18" rx="4" fill="#070A14" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
        <text x="0" y="54.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="8.5" font-weight="700" fill="#C084FC" text-anchor="middle">RESILIX</text>
      </g>

      <!-- ═══ 3D ISOMETRIC CUBE 4: FORGE (Pink Theme) ═══ -->
      <g transform="translate(175, 195)">
        <!-- Top Face -->
        <polygon points="0,-14 22,-2 0,10 -22,-2" fill="url(#isoTopPink)" stroke="#F472B6" stroke-width="1.4"/>
        <!-- Left Face -->
        <polygon points="-22,-2 0,10 0,36 -22,24" fill="url(#isoLeftPink)" stroke="#EC4899" stroke-width="1.4"/>
        <!-- Right Face -->
        <polygon points="0,10 22,-2 22,24 0,36" fill="url(#isoRightPink)" stroke="#BE185D" stroke-width="1.4"/>
        <!-- Icon -->
        <text x="0" y="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="11" fill="#F472B6" text-anchor="middle" font-weight="bold">&#10003;</text>

        <!-- Technical Label Badge -->
        <rect x="-36" y="42" width="72" height="18" rx="4" fill="#070A14" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1"/>
        <text x="0" y="54.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="8.5" font-weight="700" fill="#F472B6" text-anchor="middle">FORGE</text>
      </g>

      <!-- Vertical Tech Legend -->
      <text x="310" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" letter-spacing="3" fill="#64748B" text-anchor="end">x / y / z</text>
    </g>

    <!-- Outer Sleek Border -->
    <rect x="1" y="1" width="998" height="288" rx="14" fill="none" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
</svg>
