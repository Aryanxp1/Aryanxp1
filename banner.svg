<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Aryan Vishwakarma — AI Systems Engineer, Data Scientist, ML Practitioner, Data Analyst">
  <defs>
    <!-- Deep Space Background -->
    <linearGradient id="spaceDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#05070B"/>
      <stop offset="50%"  stop-color="#080B14"/>
      <stop offset="100%" stop-color="#0D111E"/>
    </linearGradient>

    <!-- Isometric Face Gradients (Cyan Theme) -->
    <linearGradient id="isoTopCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="isoLeftCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="isoRightCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Isometric Face Gradients (Violet Theme) -->
    <linearGradient id="isoTopViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="isoLeftViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="isoRightViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Isometric Face Gradients (Blue Theme) -->
    <linearGradient id="isoTopBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="isoLeftBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="isoRightBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Isometric Face Gradients (Pink Theme) -->
    <linearGradient id="isoTopPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="isoLeftPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="isoRightPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EC4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="bannerFrame">
      <rect width="1000" height="320" rx="14"/>
    </clipPath>

    <!-- Circuit Paths connecting 3D cubes -->
    <path id="pathSolvaToVayu" d="M 700 86 L 850 126"/>
    <path id="pathSolvaToResilix" d="M 700 86 L 610 166"/>
    <path id="pathVayuToForge" d="M 850 126 L 830 206"/>
    <path id="pathResilixToForge" d="M 610 166 L 830 206"/>
  </defs>

  <g clip-path="url(#bannerFrame)">
    <rect width="1000" height="320" fill="url(#spaceDark)"/>

    <!-- ═══ LEFT IDENTITY SECTION ═══ -->
    <g transform="translate(54, 52)">
      <!-- Minimalist Status Line -->
      <g transform="translate(0, 0)">
        <circle cx="4" cy="4" r="3.5" fill="#00F0FF">
          <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="7.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="10" font-weight="700" letter-spacing="3" fill="#00F0FF">KERNEL // ONLINE</text>
      </g>

      <!-- Terminal Prefix -->
      <text x="0" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11.5" letter-spacing="2.5" font-weight="600" fill="#6366F1">// ARCHITECTING INTELLIGENT SYSTEMS</text>

      <!-- Name Title -->
      <text x="0" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="38" font-weight="900" letter-spacing="1.5" fill="#F8FAFC" filter="url(#softGlow)">ARYAN VISHWAKARMA</text>

      <!-- Four Core Roles -->
      <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700">
        <text x="0" y="126" fill="#00F0FF">AI SYSTEMS ENGINEER</text>
        <text x="156" y="126" fill="#475569">&#9670;</text>
        <text x="172" y="126" fill="#8B5CF6">DATA SCIENTIST</text>
        <text x="282" y="126" fill="#475569">&#9670;</text>
        <text x="298" y="126" fill="#38BDF8">ML PRACTITIONER</text>
        <text x="422" y="126" fill="#475569">&#9670;</text>
        <text x="438" y="126" fill="#A855F7">DATA ANALYST</text>
      </g>

      <!-- Philosophy Line -->
      <text x="0" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" fill="#94A3B8">
        Turning complex statistical variance into deterministic, fault-tolerant intelligence.
      </text>

      <!-- Minimalist Clean Badges -->
      <g transform="translate(0, 180)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5">
        <rect x="0" y="0" width="134" height="24" rx="12" fill="#0D111E" stroke="#6366F1" stroke-opacity="0.4"/>
        <text x="67" y="15.5" text-anchor="middle" fill="#CBD5E1">Statistical Indexing</text>

        <rect x="142" y="0" width="130" height="24" rx="12" fill="#0D111E" stroke="#00F0FF" stroke-opacity="0.4"/>
        <text x="207" y="15.5" text-anchor="middle" fill="#CBD5E1">Anomaly Detection</text>

        <rect x="280" y="0" width="124" height="24" rx="12" fill="#0D111E" stroke="#8B5CF6" stroke-opacity="0.4"/>
        <text x="342" y="15.5" text-anchor="middle" fill="#CBD5E1">Chaos Resilience</text>

        <rect x="412" y="0" width="120" height="24" rx="12" fill="#0D111E" stroke="#38BDF8" stroke-opacity="0.4"/>
        <text x="472" y="15.5" text-anchor="middle" fill="#CBD5E1">Storage Engines</text>
      </g>
    </g>

    <!-- ═══ RIGHT: 3D ISOMETRIC CUBE ARCHITECTURE NETWORK ═══ -->
    <g transform="translate(480, 0)">
      <!-- Isometric Floor Grid (Angled 30 degree lines) -->
      <g stroke="#6366F1" stroke-opacity="0.12" stroke-width="1" fill="none">
        <!-- Axes going down-right -->
        <line x1="20"  y1="80"  x2="260" y2="220"/>
        <line x1="60"  y1="60"  x2="300" y2="200"/>
        <line x1="100" y1="40"  x2="340" y2="180"/>
        <line x1="140" y1="20"  x2="380" y2="160"/>
        <line x1="180" y1="0"   x2="420" y2="140"/>
        <line x1="220" y1="-20" x2="460" y2="120"/>

        <!-- Axes going down-left -->
        <line x1="100" y1="200" x2="320" y2="70"/>
        <line x1="140" y1="220" x2="360" y2="90"/>
        <line x1="180" y1="240" x2="400" y2="110"/>
        <line x1="220" y1="260" x2="440" y2="130"/>
        <line x1="260" y1="280" x2="480" y2="150"/>
      </g>

      <!-- Projection Drop-shadows & Stems to Grid Floor -->
      <g stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3" fill="none">
        <line x1="220" y1="86"  x2="220" y2="146"/>
        <line x1="370" y1="126" x2="370" y2="186"/>
        <line x1="130" y1="166" x2="130" y2="226"/>
        <line x1="350" y1="206" x2="350" y2="266"/>
      </g>

      <!-- Interconnecting Circuit Paths -->
      <g stroke="#6366F1" stroke-width="1.6" stroke-opacity="0.5" fill="none">
        <path d="M 220 86 L 370 126"/>
        <path d="M 220 86 L 130 166"/>
        <path d="M 370 126 L 350 206"/>
        <path d="M 130 166 L 350 206"/>
      </g>

      <!-- Animated Glowing Data Packets -->
      <circle r="3.5" fill="#00F0FF">
        <animateMotion dur="3s" repeatCount="indefinite" path="M 220 86 L 370 126"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.5" fill="#8B5CF6">
        <animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M 220 86 L 130 166"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.5" fill="#38BDF8">
        <animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M 370 126 L 350 206"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.5" fill="#EC4899">
        <animateMotion dur="3.4s" begin="1.2s" repeatCount="indefinite" path="M 130 166 L 350 206"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>

      <!-- ═══ 3D ISOMETRIC CUBE 1: SOLVA (Cyan Theme) ═══ -->
      <g transform="translate(220, 86)">
        <!-- Highlight Halo Ring around active cube (as in image 3) -->
        <ellipse cx="0" cy="0" rx="36" ry="22" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.6"/>
        <ellipse cx="0" cy="0" rx="42" ry="26" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3 4"/>

        <!-- Top Face -->
        <polygon points="0,-16 26,-2 0,12 -26,-2" fill="url(#isoTopCyan)" stroke="#00F0FF" stroke-width="1.4"/>
        <!-- Left Face -->
        <polygon points="-26,-2 0,12 0,42 -26,28" fill="url(#isoLeftCyan)" stroke="#00F0FF" stroke-width="1.4"/>
        <!-- Right Face -->
        <polygon points="0,12 26,-2 26,28 0,42" fill="url(#isoRightCyan)" stroke="#00F0FF" stroke-width="1.4"/>
        <!-- Icon on Top Face (Search / Inspection Symbol ⌕) -->
        <text x="0" y="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="12" fill="#00F0FF" text-anchor="middle" font-weight="bold">&#9029;</text>

        <!-- Technical Label Badge -->
        <rect x="-44" y="48" width="88" height="20" rx="4" fill="#070A14" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1"/>
        <text x="0" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="9.5" font-weight="700" fill="#00F0FF" text-anchor="middle">SOLVA AI</text>
      </g>

      <!-- ═══ 3D ISOMETRIC CUBE 2: VAYUSUTRA (Blue Theme) ═══ -->
      <g transform="translate(370, 126)">
        <!-- Top Face -->
        <polygon points="0,-16 26,-2 0,12 -26,-2" fill="url(#isoTopBlue)" stroke="#38BDF8" stroke-width="1.4"/>
        <!-- Left Face -->
        <polygon points="-26,-2 0,12 0,42 -26,28" fill="url(#isoLeftBlue)" stroke="#38BDF8" stroke-width="1.4"/>
        <!-- Right Face -->
        <polygon points="0,12 26,-2 26,28 0,42" fill="url(#isoRightBlue)" stroke="#38BDF8" stroke-width="1.4"/>
        <!-- Icon (Command / Econometrics ⌘) -->
        <text x="0" y="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="12" fill="#38BDF8" text-anchor="middle" font-weight="bold">&#8984;</text>

        <!-- Technical Label Badge -->
        <rect x="-48" y="48" width="96" height="20" rx="4" fill="#070A14" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="0" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">VAYUSUTRA</text>
      </g>

      <!-- ═══ 3D ISOMETRIC CUBE 3: RESILIX (Violet Theme) ═══ -->
      <g transform="translate(130, 166)">
        <!-- Top Face -->
        <polygon points="0,-16 26,-2 0,12 -26,-2" fill="url(#isoTopViolet)" stroke="#A855F7" stroke-width="1.4"/>
        <!-- Left Face -->
        <polygon points="-26,-2 0,12 0,42 -26,28" fill="url(#isoLeftViolet)" stroke="#A855F7" stroke-width="1.4"/>
        <!-- Right Face -->
        <polygon points="0,12 26,-2 26,28 0,42" fill="url(#isoRightViolet)" stroke="#A855F7" stroke-width="1.4"/>
        <!-- Icon (Diamond / Shield ◇) -->
        <text x="0" y="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="12" fill="#A855F7" text-anchor="middle" font-weight="bold">&#9671;</text>

        <!-- Technical Label Badge -->
        <rect x="-42" y="48" width="84" height="20" rx="4" fill="#070A14" stroke="#A855F7" stroke-opacity="0.5" stroke-width="1"/>
        <text x="0" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="9" font-weight="700" fill="#A855F7" text-anchor="middle">RESILIX</text>
      </g>

      <!-- ═══ 3D ISOMETRIC CUBE 4: FORGE (Pink Theme) ═══ -->
      <g transform="translate(350, 206)">
        <!-- Top Face -->
        <polygon points="0,-16 26,-2 0,12 -26,-2" fill="url(#isoTopPink)" stroke="#EC4899" stroke-width="1.4"/>
        <!-- Left Face -->
        <polygon points="-26,-2 0,12 0,42 -26,28" fill="url(#isoLeftPink)" stroke="#EC4899" stroke-width="1.4"/>
        <!-- Right Face -->
        <polygon points="0,12 26,-2 26,28 0,42" fill="url(#isoRightPink)" stroke="#EC4899" stroke-width="1.4"/>
        <!-- Icon (Storage / Check ✓) -->
        <text x="0" y="3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="12" fill="#EC4899" text-anchor="middle" font-weight="bold">&#10003;</text>

        <!-- Technical Label Badge -->
        <rect x="-40" y="48" width="80" height="20" rx="4" fill="#070A14" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1"/>
        <text x="0" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="9" font-weight="700" fill="#EC4899" text-anchor="middle">FORGE</text>
      </g>

      <!-- Vertical Tech Legend (As in Image 3) -->
      <text x="490" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" letter-spacing="3" fill="#64748B" text-anchor="end">x / y / z</text>
    </g>

    <!-- Outer Sleek Border -->
    <rect x="1" y="1" width="998" height="318" rx="14" fill="none" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
</svg>
