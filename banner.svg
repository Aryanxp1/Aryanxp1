<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Aryan Vishwakarma — AI Systems Engineer, Data Scientist, ML Practitioner, Data Analyst">
  <defs>
    <!-- Deep Space Midnight Background -->
    <linearGradient id="spaceDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#06070C"/>
      <stop offset="50%"  stop-color="#090C16"/>
      <stop offset="100%" stop-color="#0D101E"/>
    </linearGradient>

    <!-- Sleek Violet-Cyan Accent Gradient -->
    <linearGradient id="glowRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweepGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Nebula Glow -->
    <radialGradient id="nebulaSoft" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Minimal Dot Grid -->
    <pattern id="gridDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.75" fill="#6366F1" fill-opacity="0.12"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="bannerFrame">
      <rect width="1000" height="260" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerFrame)">
    <!-- Base Canvas -->
    <rect width="1000" height="260" fill="url(#spaceDark)"/>
    <rect width="1000" height="260" fill="url(#gridDots)"/>
    <rect width="1000" height="260" fill="url(#nebulaSoft)"/>

    <!-- Top Minimal Status Line -->
    <g transform="translate(54, 34)">
      <circle cx="0" cy="0" r="3.5" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="14" y="3.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10" font-weight="700" letter-spacing="3" fill="#00F0FF">KERNEL // ONLINE</text>
      <text x="165" y="3.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10" letter-spacing="2" fill="#475569">//</text>
      <text x="185" y="3.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10" letter-spacing="2" fill="#94A3B8">AI SYSTEMS · DATA SCIENCE · QUANTITATIVE ANALYSIS</text>
    </g>

    <!-- ═══ LEFT IDENTITY SECTION (Spacious & Clean) ═══ -->
    <g transform="translate(54, 62)">
      <!-- Name Title -->
      <text x="0" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="38" font-weight="900" letter-spacing="1.5" fill="#F8FAFC" filter="url(#softGlow)">ARYAN VISHWAKARMA</text>

      <!-- Roles Subtitle -->
      <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700">
        <text x="0" y="82" fill="#00F0FF">AI SYSTEMS ENGINEER</text>
        <text x="156" y="82" fill="#475569">&#9670;</text>
        <text x="172" y="82" fill="#8B5CF6">DATA SCIENTIST</text>
        <text x="282" y="82" fill="#475569">&#9670;</text>
        <text x="298" y="82" fill="#38BDF8">ML PRACTITIONER</text>
        <text x="422" y="82" fill="#475569">&#9670;</text>
        <text x="438" y="82" fill="#A855F7">DATA ANALYST</text>
      </g>

      <!-- Philosophy Line -->
      <text x="0" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" fill="#94A3B8">
        Turning complex statistical variance into deterministic, fault-tolerant intelligence.
      </text>

      <!-- Minimalist Clean Badges -->
      <g transform="translate(0, 130)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5">
        <rect x="0" y="0" width="134" height="22" rx="11" fill="#0D111E" stroke="#6366F1" stroke-opacity="0.4"/>
        <text x="67" y="14.5" text-anchor="middle" fill="#CBD5E1">Statistical Indexing</text>

        <rect x="142" y="0" width="130" height="22" rx="11" fill="#0D111E" stroke="#00F0FF" stroke-opacity="0.4"/>
        <text x="207" y="14.5" text-anchor="middle" fill="#CBD5E1">Anomaly Detection</text>

        <rect x="280" y="0" width="124" height="22" rx="11" fill="#0D111E" stroke="#8B5CF6" stroke-opacity="0.4"/>
        <text x="342" y="14.5" text-anchor="middle" fill="#CBD5E1">Chaos Resilience</text>

        <rect x="412" y="0" width="120" height="22" rx="11" fill="#0D111E" stroke="#38BDF8" stroke-opacity="0.4"/>
        <text x="472" y="14.5" text-anchor="middle" fill="#CBD5E1">Storage Engines</text>
      </g>
    </g>

    <!-- ═══ RIGHT HOLOGRAPHIC TELEMETRY HUB (NO CLUNKY BOXES!) ═══ -->
    <g transform="translate(800, 130)">
      <!-- Concentric Orbital Reticles -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="#1E2640" stroke-width="1" stroke-dasharray="3 5"/>
      <circle cx="0" cy="0" r="54" fill="#080B14" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="32" fill="#0B0F1C" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>

      <!-- Rotating Radar Sweep -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        <path d="M 0 0 L 46 -26 A 52 52 0 0 1 52 0 Z" fill="url(#sweepGradient)"/>
        <line x1="0" y1="0" x2="52" y2="0" stroke="#00F0FF" stroke-width="1.2"/>
      </g>

      <!-- Center Telemetry Beacon -->
      <circle cx="0" cy="0" r="4" fill="#00F0FF">
        <animate attributeName="r" values="3;5.5;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Integrated Equalizer Bars (Live Moving Bars seamlessly anchored inside the HUD) -->
      <g transform="translate(-18, -14)">
        <rect x="0"  y="0" width="3" height="20" rx="1.5" fill="#6366F1">
          <animate attributeName="height" values="8;28;12;24;8" dur="1.7s" repeatCount="indefinite"/>
        </rect>
        <rect x="7"  y="0" width="3" height="26" rx="1.5" fill="#8B5CF6">
          <animate attributeName="height" values="16;32;10;26;16" dur="1.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="14" y="0" width="3" height="16" rx="1.5" fill="#00F0FF">
          <animate attributeName="height" values="10;24;30;8;10" dur="2.0s" repeatCount="indefinite"/>
        </rect>
        <rect x="21" y="0" width="3" height="28" rx="1.5" fill="#38BDF8">
          <animate attributeName="height" values="24;10;32;18;24" dur="1.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="28" y="0" width="3" height="18" rx="1.5" fill="#A855F7">
          <animate attributeName="height" values="10;26;16;30;10" dur="1.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Four Minimalist Project Telemetry Pins (Sleek text & indicator dots, NO BOXES!) -->
      <!-- Top: SOLVA -->
      <g transform="translate(0, -90)">
        <circle cx="-38" cy="0" r="3" fill="#00F0FF"/>
        <text x="-28" y="3.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="10" font-weight="700" fill="#00F0FF">SOLVA</text>
        <text x="18" y="3.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="8.5" fill="#64748B">Ollama AI</text>
      </g>

      <!-- Right: VAYUSUTRA -->
      <g transform="translate(86, -16)">
        <circle cx="0" cy="0" r="3" fill="#38BDF8"/>
        <text x="10" y="3.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="10" font-weight="700" fill="#38BDF8">VAYUSUTRA</text>
        <text x="10" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="8" fill="#64748B">CPI Index</text>
      </g>

      <!-- Bottom: FORGE -->
      <g transform="translate(0, 94)">
        <circle cx="-36" cy="0" r="3" fill="#EC4899"/>
        <text x="-26" y="3.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="10" font-weight="700" fill="#EC4899">FORGE</text>
        <text x="16" y="3.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="8.5" fill="#64748B">WAL Storage</text>
      </g>

      <!-- Left: RESILIX -->
      <g transform="translate(-165, -16)">
        <circle cx="68" cy="0" r="3" fill="#8B5CF6"/>
        <text x="0" y="3.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="10" font-weight="700" fill="#8B5CF6" text-anchor="start">RESILIX</text>
        <text x="0" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="8" fill="#64748B">Chaos Guard</text>
      </g>
    </g>

    <!-- Outer Sleek Border -->
    <rect x="1" y="1" width="998" height="258" rx="14" fill="none" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
</svg>
