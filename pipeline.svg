<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Aryanxp1 Durable System Architecture and Pipeline Contract">
  <defs>
    <linearGradient id="pipeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#06090E"/>
      <stop offset="60%"  stop-color="#0A1017"/>
      <stop offset="100%" stop-color="#0F1722"/>
    </linearGradient>

    <linearGradient id="pipeEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF66" stop-opacity="0.3"/>
      <stop offset="50%"  stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="pipeRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#00FF66" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>

    <pattern id="pipeGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00FF66" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <clipPath id="pipeFrame">
      <rect width="1000" height="230" rx="12"/>
    </clipPath>

    <path id="pipelineTrack" d="M30 110 L970 110"/>
  </defs>

  <g clip-path="url(#pipeFrame)">
    <rect width="1000" height="230" fill="url(#pipeDark)"/>
    <rect width="1000" height="230" fill="url(#pipeGrid)"/>

    <!-- Section Header -->
    <text x="36" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="11.5" letter-spacing="3.2" font-weight="700" fill="#00FF66">DURABLE SYSTEM ARCHITECTURE // EXECUTION CONTRACT</text>
    <rect x="36" y="48" width="120" height="2" fill="url(#pipeRule)"/>

    <!-- Central Backbone Track -->
    <line x1="30" y1="110" x2="970" y2="110" stroke="url(#pipeEdge)" stroke-width="1.8"/>

    <!-- Pipeline Nodes -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#E2E8F0" text-anchor="middle">
      <!-- Stage 1 -->
      <rect x="30" y="90" width="94" height="40" rx="7" fill="#0D1520" stroke="#1E293B" stroke-width="1.2"/>
      <text x="77" y="115">Ingestion</text>

      <!-- Stage 2: Solva AI -->
      <rect x="144" y="90" width="124" height="40" rx="7" fill="#0D1520" stroke="#00FF66" stroke-width="1.4"/>
      <text x="206" y="110" fill="#00FF66" font-weight="700">Solva AI</text>
      <text x="206" y="123" font-size="9" fill="#94A3B8">Anomaly Filter</text>

      <!-- Stage 3 -->
      <rect x="288" y="90" width="106" height="40" rx="7" fill="#0D1520" stroke="#1E293B" stroke-width="1.2"/>
      <text x="341" y="115">Sanitize</text>

      <!-- Stage 4: ResiliX -->
      <rect x="414" y="90" width="136" height="40" rx="7" fill="#0D1520" stroke="#00E5FF" stroke-width="1.4"/>
      <text x="482" y="110" fill="#00E5FF" font-weight="700">ResiliX Guard</text>
      <text x="482" y="123" font-size="9" fill="#94A3B8">Rate/Safety Limit</text>

      <!-- Stage 5: Forge -->
      <rect x="570" y="90" width="120" height="40" rx="7" fill="#0D1520" stroke="#38BDF8" stroke-width="1.4"/>
      <text x="630" y="110" fill="#38BDF8" font-weight="700">Forge Engine</text>
      <text x="630" y="123" font-size="9" fill="#94A3B8">Crash-Safe Store</text>

      <!-- Stage 6: VayuSutra -->
      <rect x="710" y="90" width="144" height="40" rx="7" fill="#0D1520" stroke="#10B981" stroke-width="1.4"/>
      <text x="782" y="110" fill="#10B981" font-weight="700">VayuSutra APIx</text>
      <text x="782" y="123" font-size="9" fill="#94A3B8">Index / Analytics</text>

      <!-- Stage 7: Deliver -->
      <rect x="874" y="90" width="96" height="40" rx="7" fill="#0D1520" stroke="#1E293B" stroke-width="1.2"/>
      <text x="922" y="115">Decision</text>
    </g>

    <!-- Animated Data Packet -->
    <circle r="4.5" fill="#FFFFFF">
      <animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#pipelineTrack"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="none" stroke="#00FF66" stroke-width="1.5">
      <animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#pipelineTrack"/></animateMotion>
      <animate attributeName="opacity" values="0;0.8;0.8;0.8;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Feedback Remediation Loop Arc -->
    <path d="M 482 136 Q 341 184 206 136" fill="none" stroke="#00E5FF" stroke-opacity="0.6"
          stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="341" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="10.5" fill="#00E5FF" text-anchor="middle">&#8635; autonomous anomaly feedback &amp; remediation loop</text>

    <!-- Bottom Description -->
    <text x="36" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="10" fill="#64748B">local-first validation &#183; crash-recovery storage &#183; zero-dependency architecture &#183; cpi-grade indices</text>

    <!-- Border Glow -->
    <rect x="0.5" y="0.5" width="999" height="229" rx="12" fill="none" stroke="#00FF66" stroke-opacity="0.22"/>
  </g>
</svg>
