<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Aryanxp1 End-to-End Data Science &amp; AI Systems Architecture">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="pipeVoid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#06070D"/>
      <stop offset="50%"  stop-color="#090C16"/>
      <stop offset="100%" stop-color="#0E1220"/>
    </linearGradient>

    <!-- Branch Lasers -->
    <linearGradient id="laserCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="50%"  stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="laserViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="50%"  stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="nodeGlowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="pipeDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#6366F1" fill-opacity="0.1"/>
    </pattern>

    <clipPath id="pipeClip">
      <rect width="1000" height="230" rx="14"/>
    </clipPath>

    <!-- Motion Tracks -->
    <path id="trackTop" d="M 100 115 C 180 115, 220 65, 340 65 L 620 65 C 740 65, 780 115, 880 115"/>
    <path id="trackBottom" d="M 100 115 C 180 115, 220 165, 340 165 L 620 165 C 740 165, 780 115, 880 115"/>
  </defs>

  <g clip-path="url(#pipeClip)">
    <!-- Base Background -->
    <rect width="1000" height="230" fill="url(#pipeVoid)"/>
    <rect width="1000" height="230" fill="url(#pipeDots)"/>

    <!-- Header Telemetry Title -->
    <text x="48" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="10.5" letter-spacing="3" font-weight="700" fill="#00F0FF">PIPELINE ARCHITECTURE // DATA SCIENCE &amp; SYSTEM FLOW</text>
    <text x="48" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="9" fill="#64748B">DUAL-CHANNEL SYNCHRONIZED EXECUTION MATRIX</text>

    <!-- Stream Curves -->
    <path d="M 100 115 C 180 115, 220 65, 340 65 L 620 65 C 740 65, 780 115, 880 115"
          fill="none" stroke="url(#laserCyan)" stroke-width="2"/>
    <path d="M 100 115 C 180 115, 220 165, 340 165 L 620 165 C 740 165, 780 115, 880 115"
          fill="none" stroke="url(#laserViolet)" stroke-width="2"/>

    <!-- Dynamic Flow Packets -->
    <circle r="4" fill="#00F0FF">
      <animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#trackTop"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#EC4899">
      <animateMotion dur="4.5s" begin="0.8s" repeatCount="indefinite"><mpath href="#trackBottom"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Cross-Channel Sync Line -->
    <line x1="480" y1="65" x2="480" y2="165" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.5"/>
    <text x="488" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="8" fill="#8B5CF6" transform="rotate(-90 488 118)" text-anchor="middle">SYNC</text>

    <!-- ═══ NODE 1: Ingest (Left) ═══ -->
    <g transform="translate(100, 115)">
      <circle cx="0" cy="0" r="16" fill="url(#nodeGlowCyan)"/>
      <circle cx="0" cy="0" r="8" fill="#070A12" stroke="#00F0FF" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#00F0FF"/>
      <text x="0" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="middle">INGEST</text>
      <text x="0" y="35" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#64748B" text-anchor="middle">Stream &amp; Batch</text>
    </g>

    <!-- ═══ TOP CHANNEL: DATA SCIENCE & ANALYTICS ═══ -->
    <!-- Node 2A: Solva AI -->
    <g transform="translate(340, 65)">
      <circle cx="0" cy="0" r="18" fill="url(#nodeGlowCyan)"/>
      <circle cx="0" cy="0" r="9" fill="#070A12" stroke="#00F0FF" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#00F0FF"/>
      <text x="0" y="-18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" font-weight="700" fill="#00F0FF" text-anchor="middle">SOLVA AI</text>
      <text x="0" y="-7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#94A3B8" text-anchor="middle">Anomaly Detection · Ollama</text>
    </g>

    <!-- Node 3A: VayuSutra -->
    <g transform="translate(620, 65)">
      <circle cx="0" cy="0" r="18" fill="url(#nodeGlowCyan)"/>
      <circle cx="0" cy="0" r="9" fill="#070A12" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#38BDF8"/>
      <text x="0" y="-18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">VAYUSUTRA APIx</text>
      <text x="0" y="-7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#94A3B8" text-anchor="middle">CPI Econometric Index</text>
    </g>

    <!-- ═══ BOTTOM CHANNEL: RESILIENCE & STORAGE ═══ -->
    <!-- Node 2B: ResiliX -->
    <g transform="translate(340, 165)">
      <circle cx="0" cy="0" r="18" fill="url(#nodeGlowViolet)"/>
      <circle cx="0" cy="0" r="9" fill="#070A12" stroke="#A855F7" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#A855F7"/>
      <text x="0" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" font-weight="700" fill="#A855F7" text-anchor="middle">RESILIX</text>
      <text x="0" y="35" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#94A3B8" text-anchor="middle">Chaos &amp; Token Gate</text>
    </g>

    <!-- Node 3B: Forge Engine -->
    <g transform="translate(620, 165)">
      <circle cx="0" cy="0" r="18" fill="url(#nodeGlowViolet)"/>
      <circle cx="0" cy="0" r="9" fill="#070A12" stroke="#EC4899" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#EC4899"/>
      <text x="0" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">FORGE ENGINE</text>
      <text x="0" y="35" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#94A3B8" text-anchor="middle">WAL Crash-Safe Store</text>
    </g>

    <!-- ═══ NODE 4: Decision (Right) ═══ -->
    <g transform="translate(880, 115)">
      <circle cx="0" cy="0" r="18" fill="url(#nodeGlowCyan)"/>
      <circle cx="0" cy="0" r="9" fill="#070A12" stroke="#6366F1" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#6366F1"/>
      <text x="0" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="middle">DECISION API</text>
      <text x="0" y="35" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8" fill="#64748B" text-anchor="middle">Zero Data Loss</text>
    </g>

    <!-- Outer Border -->
    <rect x="1" y="1" width="998" height="228" rx="14" fill="none" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
</svg>
