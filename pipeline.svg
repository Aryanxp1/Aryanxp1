<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Aryanxp1 End-to-End Data Science & AI Systems Flow Matrix">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="matrixVoid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#060810"/>
      <stop offset="50%"  stop-color="#090D18"/>
      <stop offset="100%" stop-color="#0E1222"/>
    </linearGradient>

    <!-- Branch Paths Gradient -->
    <linearGradient id="cyanBranch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="50%"  stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="violetBranch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="50%"  stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="flowGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#6366F1" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <clipPath id="matrixClip">
      <rect width="1000" height="270" rx="14"/>
    </clipPath>

    <!-- Animated Dual Branch Paths -->
    <!-- Top Path: Data Science & Analytics (Ingest -> Solva -> VayuSutra -> Output) -->
    <path id="topTrack" d="M 120 135 C 190 135, 210 75, 300 75 L 430 75 C 500 75, 520 75, 600 75 L 720 75 C 800 75, 820 135, 890 135"/>

    <!-- Bottom Path: AI Systems & Storage (Ingest -> ResiliX -> Forge -> Output) -->
    <path id="bottomTrack" d="M 120 135 C 190 135, 210 195, 300 195 L 430 195 C 500 195, 520 195, 600 195 L 720 195 C 800 195, 820 135, 890 135"/>
  </defs>

  <g clip-path="url(#matrixClip)">
    <rect width="1000" height="270" fill="url(#matrixVoid)"/>
    <rect width="1000" height="270" fill="url(#flowGrid)"/>

    <!-- Header Header & Metadata -->
    <g transform="translate(36, 28)">
      <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" letter-spacing="3" font-weight="700" fill="#00F0FF">DUAL-CORE ARCHITECTURE // DATA SCIENCE &amp; SYSTEM ENGINES</text>
      <text x="0" y="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="9.5" fill="#64748B">SYNCHRONIZED ANALYTICS &amp; FAULT-TOLERANT EXECUTION</text>
    </g>

    <!-- Top Track Background Line (Analytics Channel) -->
    <path d="M 120 135 C 190 135, 210 75, 300 75 L 430 75 C 500 75, 520 75, 600 75 L 720 75 C 800 75, 820 135, 890 135"
          fill="none" stroke="url(#cyanBranch)" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Bottom Track Background Line (Systems Channel) -->
    <path d="M 120 135 C 190 135, 210 195, 300 195 L 430 195 C 500 195, 520 195, 600 195 L 720 195 C 800 195, 820 135, 890 135"
          fill="none" stroke="url(#violetBranch)" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Animated Data Packets (Analytics: Cyan; Systems: Violet) -->
    <circle r="4.5" fill="#00F0FF">
      <animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#topTrack"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#EC4899">
      <animateMotion dur="4.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#bottomTrack"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Cross-channel Remediation Sync Bridge -->
    <line x1="365" y1="95" x2="365" y2="175" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.5"/>
    <text x="372" y="139" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="8.5" fill="#8B5CF6" transform="rotate(-90 372 139)" text-anchor="middle">SYNC BRIDGE</text>

    <!-- NODE 1: Ingestion Gateway (Left Central) -->
    <g transform="translate(60, 115)">
      <rect x="0" y="0" width="110" height="40" rx="8" fill="#0D1120" stroke="#6366F1" stroke-width="1.4"/>
      <circle cx="16" cy="20" r="4" fill="#00F0FF"/>
      <text x="28" y="19" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" font-weight="700" fill="#F8FAFC">RAW INGEST</text>
      <text x="28" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8.5" fill="#64748B">Telemetry &amp; Feeds</text>
    </g>

    <!-- TOP CHANNEL (Data Science & Analytics) -->
    <g transform="translate(230, 42)">
      <rect x="0" y="0" width="134" height="20" rx="4" fill="#0E1628"/>
      <text x="8" y="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="9" font-weight="700" fill="#00F0FF">&#9650; DATA SCIENCE &amp; ANALYTICS TIER</text>
    </g>

    <!-- Node 2A: Solva AI (Top Left) -->
    <g transform="translate(285, 55)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#0A1122" stroke="#00F0FF" stroke-width="1.4"/>
      <text x="14" y="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11.5" font-weight="700" fill="#00F0FF">SOLVA AI</text>
      <text x="14" y="33" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="9" fill="#94A3B8">Anomaly &amp; Outlier Filter</text>
      <!-- Small metric tag -->
      <rect x="110" y="8" width="40" height="14" rx="3" fill="#1E293B"/>
      <text x="130" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="7.5" fill="#38BDF8" text-anchor="middle">OLLAMA</text>
    </g>

    <!-- Node 3A: VayuSutra APIx (Top Right) -->
    <g transform="translate(560, 55)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#0A1122" stroke="#38BDF8" stroke-width="1.4"/>
      <text x="14" y="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11.5" font-weight="700" fill="#38BDF8">VAYUSUTRA APIx</text>
      <text x="14" y="33" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="9" fill="#94A3B8">CPI Jevons / Laspeyres Index</text>
      <rect x="126" y="8" width="34" height="14" rx="3" fill="#1E293B"/>
      <text x="143" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="7.5" fill="#00F0FF" text-anchor="middle">LIVE</text>
    </g>

    <!-- BOTTOM CHANNEL (System Engineering & Storage) -->
    <g transform="translate(230, 238)">
      <rect x="0" y="0" width="144" height="20" rx="4" fill="#180F24"/>
      <text x="8" y="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="9" font-weight="700" fill="#A855F7">&#9660; SYSTEMS &amp; STORAGE TIER</text>
    </g>

    <!-- Node 2B: ResiliX (Bottom Left) -->
    <g transform="translate(285, 175)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#120D20" stroke="#8B5CF6" stroke-width="1.4"/>
      <text x="14" y="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11.5" font-weight="700" fill="#A855F7">RESILIX GUARD</text>
      <text x="14" y="33" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="9" fill="#94A3B8">Token Bucket &amp; Chaos Gate</text>
      <rect x="114" y="8" width="36" height="14" rx="3" fill="#1E1630"/>
      <text x="132" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="7.5" fill="#A855F7" text-anchor="middle">SAFE</text>
    </g>

    <!-- Node 3B: Forge Engine (Bottom Right) -->
    <g transform="translate(560, 175)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#120D20" stroke="#EC4899" stroke-width="1.4"/>
      <text x="14" y="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11.5" font-weight="700" fill="#EC4899">FORGE ENGINE</text>
      <text x="14" y="33" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="9" fill="#94A3B8">WAL Journal &amp; Crash Recovery</text>
      <rect x="122" y="8" width="38" height="14" rx="3" fill="#20101C"/>
      <text x="141" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="7.5" fill="#EC4899" text-anchor="middle">0-DEP</text>
    </g>

    <!-- NODE 4: Intelligence Delivery (Right Central) -->
    <g transform="translate(830, 115)">
      <rect x="0" y="0" width="124" height="40" rx="8" fill="#0D1120" stroke="#6366F1" stroke-width="1.4"/>
      <circle cx="16" cy="20" r="4" fill="#A855F7"/>
      <text x="28" y="19" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="11" font-weight="700" fill="#F8FAFC">DECISION API</text>
      <text x="28" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="8.5" fill="#64748B">Zero-Loss Delivery</text>
    </g>

    <!-- Border Glow -->
    <rect x="1" y="1" width="998" height="268" rx="14" fill="none" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
</svg>
