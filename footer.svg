<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="135" viewBox="0 0 1000 135" role="img" aria-label="Aryanxp1 Footer">
  <defs>
    <linearGradient id="footDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#080D14"/>
      <stop offset="50%"  stop-color="#05080C"/>
      <stop offset="100%" stop-color="#080E16"/>
    </linearGradient>

    <linearGradient id="footRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00FF66" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>

    <pattern id="footGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00FF66" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <clipPath id="footFrame">
      <rect width="1000" height="135" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footFrame)">
    <rect width="1000" height="135" fill="url(#footDark)"/>
    <rect width="1000" height="135" fill="url(#footGrid)"/>
    <rect x="0" y="0" width="1000" height="2" fill="url(#footRule)"/>

    <!-- Terminal Command -->
    <text x="500" y="46" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">
      <tspan fill="#00FF66">$</tspan>
      <tspan fill="#94A3B8"> python -c </tspan>
      <tspan fill="#00E5FF">"import aryan; aryan.build_future()"</tspan>
    </text>

    <!-- Philosophy Quote -->
    <text x="500" y="78" text-anchor="middle"
          font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="13.5" font-style="italic" fill="#64748B">
      "Code like Senku, think like Aizen. The quieter you become, the more you can hear."
    </text>

    <!-- Status Pulse and Tag -->
    <g transform="translate(500, 108)">
      <circle cx="-100" cy="-3" r="3.5" fill="#00FF66">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-86" y="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10.5" letter-spacing="2.5" font-weight="600" fill="#00FF66">ARYAN VISHWAKARMA // GITHUB.COM/ARYANXP1</text>
    </g>

    <!-- Border -->
    <rect x="0.5" y="0.5" width="999" height="134" rx="12" fill="none" stroke="#00FF66" stroke-opacity="0.2"/>
  </g>
</svg>
