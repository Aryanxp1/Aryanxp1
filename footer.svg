<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="135" viewBox="0 0 1000 135" role="img" aria-label="Aryanxp1 Footer">
  <defs>
    <linearGradient id="footerDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#080A12"/>
      <stop offset="50%"  stop-color="#0B0D18"/>
      <stop offset="100%" stop-color="#0F1222"/>
    </linearGradient>

    <linearGradient id="footerRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <pattern id="footerDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#6366F1" fill-opacity="0.08"/>
    </pattern>

    <clipPath id="footerClip">
      <rect width="1000" height="135" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect width="1000" height="135" fill="url(#footerDark)"/>
    <rect width="1000" height="135" fill="url(#footerDots)"/>
    <rect x="0" y="0" width="1000" height="2" fill="url(#footerRule)"/>

    <!-- Terminal Command -->
    <text x="500" y="46" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
      <tspan fill="#00F0FF">&gt;</tspan>
      <tspan fill="#94A3B8"> python -c </tspan>
      <tspan fill="#8B5CF6">"import aryan; aryan.transform(data=True, intelligence=True)"</tspan>
    </text>

    <!-- Philosophy Quote -->
    <text x="500" y="78" text-anchor="middle"
          font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="13" font-style="italic" fill="#64748B">
      "From raw variance to decisive models. Code like Senku, think like Aizen."
    </text>

    <!-- Status Pulse and Tag -->
    <g transform="translate(500, 108)">
      <circle cx="-106" cy="-3" r="3.5" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-92" y="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10" letter-spacing="2.5" font-weight="600" fill="#94A3B8">
        ARYAN VISHWAKARMA // <tspan fill="#00F0FF">GITHUB.COM/ARYANXP1</tspan>
      </text>
    </g>

    <rect x="1" y="1" width="998" height="133" rx="14" fill="none" stroke="#6366F1" stroke-opacity="0.2" stroke-width="1.2"/>
  </g>
</svg>
